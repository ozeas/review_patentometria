[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patentometria"
version = "0.4.0"
description = "Pipeline de análise patentométrica: famílias, triagem, indicadores, VOSviewer e planilha base"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ozeas Souza" }]
keywords = ["patentometria", "patentes", "bibliometria", "analise de dados"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Django==5.2.18",
    "openpyxl==3.1.5",
    "platformdirs==4.13.5",
    "pypinyin==0.55.0",
    "waitress==3.0.2",
    "whitenoise==6.12.0",
]

[project.scripts]
patentometria = "config.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "studies"]

[tool.hatch.build.targets.sdist]
include = [
    "config",
    "core",
    "studies",
    "README.md",
    "requirements.txt",
    "docs/INSTALACAO.md",
    "install",
    "scripts",
    "tests",
]

[tool.uv]
package = true
